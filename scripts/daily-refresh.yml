name: Daily refresh (good news + sitemap)
on:
  schedule:
    - cron: "17 5 * * *"   # every day 05:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh good-news headlines
        run: python scripts/update_news.py
      - name: Bump sitemap lastmod
        run: sed -i -E "s#<lastmod>[0-9-]+</lastmod>#<lastmod>$(date -u +%F)</lastmod>#g" sitemap.xml
      - name: Commit if changed
        run: |
          git config user.name "positive-energy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/news.json sitemap.xml
          git diff --cached --quiet || git commit -m "Daily refresh: good news + sitemap ($(date -u +%F))"
          git push
